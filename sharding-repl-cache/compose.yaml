name: sharding-repl-cache

services:
  # ---------- Config servers ----------
  configsvr01:
    image: mongo:7
    hostname: configsvr01
    command: ["mongod", "--configsvr", "--replSet", "cfgReplSet", "--port", "27019", "--bind_ip_all"]
    networks: [mongo-net]
    volumes: [cfg1_data:/data/db]
    restart: unless-stopped

  configsvr02:
    image: mongo:7
    hostname: configsvr02
    command: ["mongod", "--configsvr", "--replSet", "cfgReplSet", "--port", "27019", "--bind_ip_all"]
    networks: [mongo-net]
    volumes: [cfg2_data:/data/db]
    restart: unless-stopped

  configsvr03:
    image: mongo:7
    hostname: configsvr03
    command: ["mongod", "--configsvr", "--replSet", "cfgReplSet", "--port", "27019", "--bind_ip_all"]
    networks: [mongo-net]
    volumes: [cfg3_data:/data/db]
    restart: unless-stopped

  # ---------- Shard 01 ----------
  shard01a:
    image: mongo:7
    hostname: shard01a
    command: ["mongod", "--shardsvr", "--replSet", "shard01", "--port", "27018", "--bind_ip_all"]
    networks: [mongo-net]
    volumes: [shard11_data:/data/db]
    restart: unless-stopped

  shard01b:
    image: mongo:7
    hostname: shard01b
    command: ["mongod", "--shardsvr", "--replSet", "shard01", "--port", "27018", "--bind_ip_all"]
    networks: [mongo-net]
    volumes: [shard12_data:/data/db]
    restart: unless-stopped

  shard01c:
    image: mongo:7
    hostname: shard01c
    command: ["mongod", "--shardsvr", "--replSet", "shard01", "--port", "27018", "--bind_ip_all"]
    networks: [mongo-net]
    volumes: [shard13_data:/data/db]
    restart: unless-stopped

  # ---------- Shard 02 ----------
  shard02a:
    image: mongo:7
    hostname: shard02a
    command: ["mongod", "--shardsvr", "--replSet", "shard02", "--port", "27018", "--bind_ip_all"]
    networks: [mongo-net]
    volumes: [shard21_data:/data/db]
    restart: unless-stopped

  shard02b:
    image: mongo:7
    hostname: shard02b
    command: ["mongod", "--shardsvr", "--replSet", "shard02", "--port", "27018", "--bind_ip_all"]
    networks: [mongo-net]
    volumes: [shard22_data:/data/db]
    restart: unless-stopped

  shard02c:
    image: mongo:7
    hostname: shard02c
    command: ["mongod", "--shardsvr", "--replSet", "shard02", "--port", "27018", "--bind_ip_all"]
    networks: [mongo-net]
    volumes: [shard23_data:/data/db]
    restart: unless-stopped

  # ---------- Mongos Router ----------
  mongos:
    image: mongo:7
    hostname: mongos
    command: >
      mongos --configdb cfgReplSet/configsvr01:27019,configsvr02:27019,configsvr03:27019
             --bind_ip_all --port 27017
    ports: ["27017:27017"]
    depends_on:
      - configsvr01
      - configsvr02
      - configsvr03
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27017 --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
      interval: 2s
      timeout: 3s
      retries: 120
      start_period: 5s
    networks: [mongo-net]
    restart: unless-stopped

  # ---------- Redis Cache ----------
  redis:
    image: redis:7-alpine
    hostname: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 2s
    networks: [mongo-net]
    restart: unless-stopped

  # ---------- Application ----------
  app:
    build: ./api_app
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: "mongodb://mongos:27017/appdb"
      MONGODB_URI: "mongodb://mongos:27017/appdb"
      REDIS_URL: "redis://redis:6379"
      MONGODB_DATABASE_NAME: "somedb"
      MONGODB_COLLECTION_NAME: "helloDoc"
    command: [ "app:app", "--host", "0.0.0.0", "--port", "8080" ]
    depends_on:
      mongos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ mongo-net ]

# ---------- Network & Volumes ----------
networks:
  mongo-net:
    driver: bridge

volumes:
  cfg1_data:
  cfg2_data:
  cfg3_data:
  shard11_data:
  shard12_data:
  shard13_data:
  shard21_data:
  shard22_data:
  shard23_data:
  redis_data:
